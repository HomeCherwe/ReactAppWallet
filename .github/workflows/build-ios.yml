name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      notes:
        description: 'Release notes'
        required: false
        default: 'Manual build'

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Create .env file
        working-directory: frontend
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env
          echo "VITE_API_URL=${{ secrets.VITE_API_URL }}" >> .env
          echo "CAPACITOR_BUILD=true" >> .env

      - name: Build React app (Vite)
        working-directory: frontend
        run: npm run build
        env:
          CAPACITOR_BUILD: 'true'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Sync Capacitor iOS
        working-directory: frontend
        run: npx cap sync ios

      - name: Install CocoaPods dependencies
        working-directory: frontend/ios/App
        run: pod install

      - name: Build unsigned IPA (for Sideloadly)
        working-directory: frontend/ios
        run: |
          xcodebuild \
            -workspace App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Wallet.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package IPA from archive
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$RUNNER_TEMP/Wallet.xcarchive/Products/Applications/App.app" \
                "$RUNNER_TEMP/Payload/App.app"
          cd "$RUNNER_TEMP"
          zip -r Wallet.ipa Payload/
          ls -lh Wallet.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wallet-iOS-${{ github.run_number }}
          path: ${{ runner.temp }}/Wallet.ipa
          retention-days: 30

name: Mobile OTA Update (EAS Update)

# Publishes the JS/assets of mobile/ to Expo. Installed builds download it on the next
# launch — no reinstall needed. Native changes still need a new .ipa (see build-mobile-ios.yml).
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/eas-update.yml'

concurrency:
  group: eas-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: Publish update
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          missing=0
          for name in EXPO_TOKEN EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_ANON_KEY EXPO_PUBLIC_API_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set (Settings → Secrets and variables → Actions)"
              missing=1
            fi
          done
          exit $missing

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Only iOS is built today; skipping Android keeps publishing fast
      - name: Publish to the production channel
        env:
          # Passed via env (not inlined) so quotes/newlines in the commit message are safe
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          MESSAGE=$(printf '%s' "${COMMIT_MESSAGE:-Manual update}" | head -n 1)
          npx --yes eas-cli@latest update --channel production --platform ios --message "$MESSAGE" --non-interactive

# The server's tests (backend/test): the real routes on a stand-in database, no secrets.
# They run on every pull request and push to main that touches the server.
name: Server tests

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/server-tests.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/server-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
